name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest
      - name: Ruff
        run: ruff check .
      - name: Mypy (per-file, since each game has its own main.py)
        run: |
          mypy games/1-10000_balls/main.py
          mypy games/2-stars/main.py
          mypy games/3-stars/main.py
      - name: Pytest
        run: python -m pytest
      - name: Smoke-test each game (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python games/2-stars/main.py --headless --frames 5
          python games/3-stars/main.py --headless --frames 5
          python games/1-10000_balls/main.py --headless --frames 5
